<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Saved words · Lithuanify</title>
    <link rel="stylesheet" href="saved.css">
</head>
<body>
    <main>
        <header>
            <h1>Saved words <span id="count" class="count">0</span></h1>
            <button id="export" class="export" type="button">Export CSV</button>
            <input id="find" class="find" type="search" placeholder="Find a word or a meaning" aria-label="Find a word or a meaning" autocomplete="off">
        </header>
        <p id="empty" class="empty" hidden>No saved words yet. On a Lithuanian page, tap a gloss, then ☆ Save on its card.</p>
        <ul id="list" class="list"></ul>
        <section id="known" class="known" hidden>
            <h2>Known words <span id="known-count" class="count">0</span></h2>
            <p class="note">Their glosses stay hidden on every page. × brings them back.</p>
            <ul id="known-list" class="list"></ul>
        </section>
    </main>
    <script src="saved.js"></script>
</body>
</html>
